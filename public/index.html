<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Singapore AI Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Current user + logout (this page requires login) -->
    <div id="userBar" class="hidden">
      <span>Logged in as <strong id="userEmail"></strong></span>
      <button onclick="logout()">Log out</button>
    </div>

    <h1>Singapore AI Guide</h1>

    <p>You may discuss various topics related to Singapore with our AI personas. Please select any persona from the list below and start chatting!</p>

  <div>
  <label for="personaSelect">Choose a persona:</label>
  <select id="personaSelect"></select>
  &emsp;
  <button onclick="resetChat()">Reset</button>
  &emsp;
  <button onclick="exportChatToPDF()">Export PDF</button>
  </div>

     <!-- New chatbot -->
    <div id="chat"></div>

    <!-- Input area -->
    <div class="input-area">
      <input id="input" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
      
    </div>
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
